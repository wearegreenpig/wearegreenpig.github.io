<h2>불온한 상상력, 그린피그</h2>

<p>생각이 세상을 바꾼다는 신념과 뜨거운 감성을 가진 사람들이 만든 공연단체입니다. 의심 없이 혹은 의심하지 않고 진행되는 우리 문명에 대한 진단을 하는 연극을 하고자 모인 사람들입니다. 주제와 예술형식의 진보를 고민하는 연극을 하고자 모인 사람들입니다. 그린피그의 작업은 저항 혹은 엑소더스를 위한 매뉴얼 혹은 도구입니다.</p>
