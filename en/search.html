<form action="search.html" role="search"><h2 class="find big"><input type="search" name="q" id="q" placeholder="Search" aria-label="Search" enterkeyhint="search" autocomplete="off"><span aria-hidden="true">Type to search</span></h2></form>

<p class="note">Searches work titles, descriptions and credits, names and theaters. With several words, only results containing all of them are shown.</p>

<div id="results"></div>

<noscript><p>Search needs JavaScript. Try the <a href="archive.html">archive</a> or the <a href="who.html">credits index</a>.</p></noscript>

<script>
// Searches within this page only. Index: search.js (made by build.py)
window.addEventListener("DOMContentLoaded", function () {
  var box = document.getElementById("q"), out = document.getElementById("results");
  var KINDS = ["People", "Theaters", "Writers", "Works"];  // 짧은 묶음을 위에, 긴 작품 목록은 아래에
  function norm(s) { return s.toLowerCase().replace(/\s+/g, ""); }
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var data = (window.S || []).map(function (r) { return { kind: r[0], label: r[1], href: r[2], extra: r[3], name: norm(r[1]), hay: norm(r[4]) }; });
  function run() {
    var q = box.value.trim();
    try { history.replaceState(null, "", q ? "?q=" + encodeURIComponent(q) : "search.html"); } catch (e) {}
    if (!q) { out.innerHTML = ""; return; }
    var terms = q.split(/\s+/).map(norm);
    var hits = data.filter(function (d) { return terms.every(function (t) { return d.hay.indexOf(t) >= 0; }); });
    // 제목·이름에 들어간 것을 먼저
    hits.sort(function (a, b) {
      var ka = KINDS.indexOf(a.kind) - KINDS.indexOf(b.kind);
      if (ka) return ka;
      var na = terms.every(function (t) { return a.name.indexOf(t) >= 0; }) ? 0 : 1;
      var nb = terms.every(function (t) { return b.name.indexOf(t) >= 0; }) ? 0 : 1;
      return na - nb;
    });
    if (!hits.length) { out.innerHTML = "<p>Nothing found.</p>"; return; }
    var html = "";
    KINDS.forEach(function (k) {
      var g = hits.filter(function (d) { return d.kind === k; });
      if (!g.length) return;
      html += "<h3>" + k + " (" + g.length + ")</h3>\n<ul class=\"cols\">\n" + g.map(function (d) {
        return '<li><a href="' + d.href + '">' + esc(d.label) + "</a> " + esc(d.extra) + "</li>";
      }).join("\n") + "\n</ul>\n";
    });
    out.innerHTML = html;
  }
  var q0 = new URLSearchParams(location.search).get("q");
  if (q0) box.value = q0;
  box.addEventListener("input", run);
  box.form.addEventListener("submit", function (e) { e.preventDefault(); run(); });
  run();
});
</script>
